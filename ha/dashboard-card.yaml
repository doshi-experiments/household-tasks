# Dashboard: Edit dashboard -> Add card -> Manual, paste one of these.

# 1) Upcoming tasks (Calendar Card Pro, installed via HACS)
type: custom:calendar-card-pro
title: Household tasks
entities:
  - entity: calendar.household_tasks
days_to_show: 14
show_past_events: false
tap_action:
  action: url
  url_path: https://tasks.<your-tailnet>.ts.net/

